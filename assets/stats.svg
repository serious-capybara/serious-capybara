<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="GitHub stats"><title>GitHub stats</title><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif}
.bd{transform-box:fill-box;transform-origin:50% 100%;animation:rise 1s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{transform:scaleY(0)}}
.beacon{opacity:0;animation:beacon 3.4s ease-in-out infinite}
@keyframes beacon{0%,100%{opacity:0}50%{opacity:.5}}
.tw{animation:tw 4.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.bd,.beacon,.tw{animation:none}}
</style><defs></defs><rect width="1200" height="150" rx="18" fill="#08161a"/><rect x=".75" y=".75" width="1198.5" height="148.5" rx="17.25" fill="none" stroke="#1d3d42" stroke-width="1.5"/><text x="150" y="88" text-anchor="middle" font-size="54" class="serif" fill="#f2c879">1</text><text x="150" y="116" text-anchor="middle" font-size="15" fill="#7fa398">Stars earned</text><rect x="300" y="34" width="1.5" height="82" fill="#1d3d42"/><text x="450" y="88" text-anchor="middle" font-size="54" class="serif" fill="#86efac">726</text><text x="450" y="116" text-anchor="middle" font-size="15" fill="#7fa398">Contributions this year</text><rect x="600" y="34" width="1.5" height="82" fill="#1d3d42"/><text x="750" y="88" text-anchor="middle" font-size="54" class="serif" fill="#86efac">16</text><text x="750" y="116" text-anchor="middle" font-size="15" fill="#7fa398">Public repositories</text><rect x="900" y="34" width="1.5" height="82" fill="#1d3d42"/><text x="1050" y="88" text-anchor="middle" font-size="54" class="serif" fill="#86efac">8</text><text x="1050" y="116" text-anchor="middle" font-size="15" fill="#7fa398">Followers</text></svg>