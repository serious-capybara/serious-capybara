ty:.3;animation-delay:3602ms"/><circle class="tw" cx="734" cy="19" r="1.5" fill="#e8f5ee" style="opacity:.3;animation-delay:3742ms"/><circle class="tw" cx="1123" cy="124" r="1.2" fill="#e8f5ee" style="opacity:.3;animation-delay:2292ms"/><circle class="tw" cx="1010" cy="101" r="1.4" fill="#e8f5ee" style="opacity:.3;animation-delay:4491ms"/><circle class="tw" cx="609" cy="59" r="0.7" fill="#e8f5ee" style="opacity:.3;animation-delay:234ms"/><circle class="tw" cx="980" cy="36" r="1.0" fill="#e8f5ee" style="opacity:.3;animation-delay:2479ms"/><path class="wv w1" d="M0 240 Q150 222 300 240 T600 240 T900 240 T1200 240 T1500 240 T1800 240 T2100 240 T2400 240 V310 H0 Z" fill="#86efac" fill-opacity="0.035"/><path class="wv w2" d="M0 260 Q150 242 300 260 T600 260 T900 260 T1200 260 T1500 260 T1800 260 T2100 260 T2400 260 V310 H0 Z" fill="#86efac" fill-opacity="0.045"/><path class="wv w3" d="M0 282 Q150 264 300 282 T600 282 T900 282 T1200 282 T1500 282 T1800 282 T2100 282 T2400 282 V310 H0 Z" fill="#86efac" fill-opacity="0.06"/></g><circle cx="150" cy="150" r="80" fill="none" stroke="url(#ring)" stroke-width="3"/><circle class="pulse" cx="150" cy="150" r="80" fill="none" stroke="url(#ring)" stroke-width="2" style="opacity:0"/><image href="data:image/jpeg;base64," x="76" y="76" width="148" height="148" clip-path="url(#av)" preserveAspectRatio="xMidYMid slice"/><text x="270" y="98" font-size="17" fill="#7fa398">@serious-capybara</text><text x="268" y="162" font-size="60" class="serif" fill="#e8f5ee">dr.capybara</text><text x="270" y="202" font-size="22" fill="#86efac">Frontend and full-stack engineer</text><text x="270" y="232" font-size="17" fill="#7fa398">Building thoughtful software that makes everyday life simpler.</text><rect x="270" y="252" width="116" height="30" rx="15" fill="#0d2428" stroke="#1d3d42"/><text x="328" y="272" text-anchor="middle" font-size="14" fill="#86efac">JavaScript</text><rect x="396" y="252" width="64" height="30" rx="15" fill="#0d2428" stroke="#1d3d42"/><text x="428" y="272" text-anchor="middle" font-size="14" fill="#86efac">HTML</text><rect x="470" y="252" width="82" height="30" rx="15" fill="#0d2428" stroke="#1d3d42"/><text x="511" y="272" text-anchor="middle" font-size="14" fill="#86efac">Kotlin</text></svg>