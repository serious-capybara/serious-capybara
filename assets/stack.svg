<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="216" viewBox="0 0 1200 216" role="img" aria-label="Most used languages"><title>Most used languages</title><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif}
.bd{transform-box:fill-box;transform-origin:50% 100%;animation:rise 1s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{transform:scaleY(0)}}
.beacon{opacity:0;animation:beacon 3.4s ease-in-out infinite}
@keyframes beacon{0%,100%{opacity:0}50%{opacity:.5}}
.tw{animation:tw 4.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.6}}
.wv{animation:wave 26s linear infinite}
.w2{animation-duration:18s;animation-direction:reverse}
.w3{animation-duration:13s}
@keyframes wave{to{transform:translateX(-1200px)}}
.dr{animation:drift 14s ease-in-out infinite alternate}
.d2{animation-duration:18s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(-90px,30px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 4.5s ease-out infinite}
@keyframes pulse{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}
.card{transform-box:fill-box;transform-origin:50% 50%;animation:lift 12s ease-in-out infinite}
@keyframes lift{0%,19%,100%{transform:scale(1)}5%,14%{transform:scale(1.02)}}
.hl{animation:glow 12s ease-in-out infinite}
@keyframes glow{0%,19%,100%{opacity:0}5%,14%{opacity:1}}
.grow{transform-box:fill-box;transform-origin:0% 50%;animation:growx .9s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes growx{from{transform:scaleX(0)}}
.ld{transform-box:fill-box;transform-origin:50% 50%;animation:dotpop 12s ease-in-out infinite}
@keyframes dotpop{0%,19%,100%{transform:scale(1)}5%,14%{transform:scale(1.5)}}
.ln{animation:hlname 12s ease-in-out infinite}
@keyframes hlname{0%,19%,100%{fill:#e8f5ee}5%,14%{fill:#86efac}}
.lp{animation:hlpct 12s ease-in-out infinite}
@keyframes hlpct{0%,19%,100%{fill:#7fa398}5%,14%{fill:#e8f5ee}}
.cshine{animation:cardsweep 12s ease-in-out infinite}
@keyframes cardsweep{0%,4%{transform:translateX(0)}18%,100%{transform:translateX(780px)}}
.shine{animation:sweep 6s ease-in-out 2s infinite}
@keyframes sweep{0%{transform:translateX(0)}60%,100%{transform:translateX(1400px)}}
@media (prefers-reduced-motion:reduce){.bd,.beacon,.tw,.wv,.dr,.pulse,.card,.hl,.grow,.ld,.ln,.lp,.shine,.cshine{animation:none}}
</style><defs><clipPath id="barclip"><rect x="40" y="96" width="1120" height="16" rx="8"/></clipPath><linearGradient id="shine"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect width="1200" height="216" rx="18" fill="#08161a"/><rect x=".75" y=".75" width="1198.5" height="214.5" rx="17.25" fill="none" stroke="#1d3d42" stroke-width="1.5"/><text x="40" y="52" font-size="24" class="serif" fill="#e8f5ee">Languages I write most</text><text x="40" y="76" font-size="14" fill="#7fa398">Share of code across my public repositories.</text><g class="grow" style="animation-delay:0ms"><rect x="40.00" y="96" width="654.85" height="16" rx="8" fill="#f1e05a"/></g><g class="grow" style="animation-delay:130ms"><rect x="697.85" y="96" width="147.09" height="16" rx="8" fill="#e34c26"/></g><g class="grow" style="animation-delay:260ms"><rect x="847.94" y="96" width="112.11" height="16" rx="8" fill="#A97BFF"/></g><g class="grow" style="animation-delay:390ms"><rect x="963.06" y="96" width="76.14" height="16" rx="8" fill="#663399"/></g><g class="grow" style="animation-delay:520ms"><rect x="1042.20" y="96" width="55.18" height="16" rx="8" fill="#b07219"/></g><g class="grow" style="animation-delay:650ms"><rect x="1100.38" y="96" width="23.67" height="16" rx="8" fill="#3178c6"/></g><g clip-path="url(#barclip)"><rect class="shine" x="-160" y="96" width="160" height="16" fill="url(#shine)"/></g><circle class="ld" cx="46" cy="149" r="6" fill="#f1e05a" style="animation-delay:1800ms"/><text class="ln" x="62" y="154" font-size="16" fill="#e8f5ee" style="animation-delay:1800ms">JavaScript</text><text class="lp" x="290" y="154" text-anchor="end" font-size="16" fill="#7fa398" style="animation-delay:1800ms">59%</text><circle class="ld" cx="426" cy="149" r="6" fill="#e34c26" style="animation-delay:3800ms"/><text class="ln" x="442" y="154" font-size="16" fill="#e8f5ee" style="animation-delay:3800ms">HTML</text><text class="lp" x="670" y="154" text-anchor="end" font-size="16" fill="#7fa398" style="animation-delay:3800ms">13%</text><circle class="ld" cx="806" cy="149" r="6" fill="#A97BFF" style="animation-delay:5800ms"/><text class="ln" x="822" y="154" font-size="16" fill="#e8f5ee" style="animation-delay:5800ms">Kotlin</text><text class="lp" x="1050" y="154" text-anchor="end" font-size="16" fill="#7fa398" style="animation-delay:5800ms">10%</text><circle class="ld" cx="46" cy="181" r="6" fill="#663399" style="animation-delay:7800ms"/><text class="ln" x="62" y="186" font-size="16" fill="#e8f5ee" style="animation-delay:7800ms">CSS</text><text class="lp" x="290" y="186" text-anchor="end" font-size="16" fill="#7fa398" style="animation-delay:7800ms">7%</text><circle class="ld" cx="426" cy="181" r="6" fill="#b07219" style="animation-delay:9800ms"/><text class="ln" x="442" y="186" font-size="16" fill="#e8f5ee" style="animation-delay:9800ms">Java</text><text class="lp" x="670" y="186" text-anchor="end" font-size="16" fill="#7fa398" style="animation-delay:9800ms">5%</text><circle class="ld" cx="806" cy="181" r="6" fill="#3178c6" style="animation-delay:11800ms"/><text class="ln" x="822" y="186" font-size="16" fill="#e8f5ee" style="animation-delay:11800ms">TypeScript</text><text class="lp" x="1050" y="186" text-anchor="end" font-size="16" fill="#7fa398" style="animation-delay:11800ms">2%</text></svg>