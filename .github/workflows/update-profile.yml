name: Update Profile Visuals

on:
  schedule:
    - cron: "0 */3   * * *"   # every 3 hours
  workflow_dispatch:         # manual run from the Actions tab
  push:
    paths:
      - ".github/workflows/update-profile.yml"
      - "scripts/generate.mjs"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate SVGs from live GitHub data
        run: node scripts/generate.mjs
        env:
          # Uses PROFILE_TOKEN if you add one (optional), otherwise the default token
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: update profile visuals" && git push)